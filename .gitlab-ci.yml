---
variables:
  FF_SCRIPT_SECTIONS: "true"
  GIT_CLONE_PATH: "${CI_BUILDS_DIR}/${CI_JOB_ID}/${CI_PIPELINE_ID}/${CI_PROJECT_NAME}"

include:
  - component: $CI_SERVER_FQDN/devops/gitlab/components/sast/secret_scan@~latest
  - component: $CI_SERVER_FQDN/devops/gitlab/components/docker/stage_build@~latest
    inputs:
      ci_requirements_file: ".gitlab/ci-requirements.yml"
      docker_build_context: "."
      job_suffix: "_web"
      matrix:
        - RUNNER: build
          DOCKER_BUILD_PLATFORM: "linux/amd64"
      needs_build:
        - secret_detection
      platforms: '["linux/amd64"]'
      registry_repository: "${CI_PIPELINE_ID}/web"
  - component: $CI_SERVER_FQDN/devops/gitlab/components/docker/stage_build@~latest
    inputs:
      ci_requirements_file: ".gitlab/ci-requirements.yml"
      docker_build_context: "viscoll-xproc/"
      job_suffix: "_xproc"
      matrix:
        - RUNNER: build
          DOCKER_BUILD_PLATFORM: "linux/amd64"
      needs_build:
        - secret_detection
      platforms: '["linux/amd64"]'
      registry_repository: "${CI_PIPELINE_ID}/xproc"
  - component: $CI_SERVER_FQDN/devops/gitlab/components/sast/trivy@~latest
    inputs:
      ci_requirements_file: ".gitlab/ci-requirements.yml"
      docker_tag_to_scan: "${CI_COMMIT_SHA}"
      job_suffix: "_web"
      needs:
        - "amend_manifest_web"
      registry_repository: "${CI_PIPELINE_ID}/web"
      stage: "test"
  - component: $CI_SERVER_FQDN/devops/gitlab/components/sast/trivy@~latest
    inputs:
      ci_requirements_file: ".gitlab/ci-requirements.yml"
      docker_tag_to_scan: "${CI_COMMIT_SHA}"
      job_suffix: "_xproc"
      needs:
        - "amend_manifest_xproc"
      registry_repository: "${CI_PIPELINE_ID}/xproc"
      stage: "test"
  - component: $CI_SERVER_FQDN/devops/gitlab/components/docker/stage_finalize@~latest
    inputs:
      ci_requirements_file: ".gitlab/ci-requirements.yml"
      final_registry_repository: "vceditor_web"
      job_suffix: "_web"
      needs_copy:
        - trivy_scan_web
      original_registry_repository: "${CI_PIPELINE_ID}/web"
  - component: $CI_SERVER_FQDN/devops/gitlab/components/docker/stage_finalize@~latest
    inputs:
      ci_requirements_file: ".gitlab/ci-requirements.yml"
      final_registry_repository: "vceditor_xproc"
      job_suffix: "_xproc"
      needs_copy:
        - trivy_scan_xproc
      original_registry_repository: "${CI_PIPELINE_ID}/xproc"

stages:
  - secret_check
  - build
  - test
  - finalize
